<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Золотой кликер</title>
<style>
:root{color-scheme:dark;--bg:#1a0608;--panel:#2a0d10;--panel2:#3a1318;--line:#5a1f26;--text:#fff3e0;--mut:#d9a9a0;--gold:#ffc83d;--gold2:#ff9f1c;--red:#e5162b;--ok:#3ddc84;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0608;--text:#fff3e0}}
:root[data-theme="dark"]{--bg:#1a0608}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Rubik","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.money{font-size:34px;font-weight:800;color:var(--gold);line-height:1}
.money small{font-size:16px}
.stats{font-size:13px;color:var(--mut);text-align:right;line-height:1.4}
.title{font-size:13px;color:var(--mut);margin:2px 0 8px}
.title b{color:var(--gold)}
.stage{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(#7a1018,#3a0a0f);aspect-ratio:1/1;cursor:pointer;touch-action:manipulation}
.stage .bg{position:absolute;inset:0;transition:background .5s}
.stage .deco{position:absolute;inset:0;font-size:34px;pointer-events:none;opacity:.8}
.stage .deco span{position:absolute}
.hero{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);transition:transform .08s;pointer-events:none;border-radius:0}
.stage.hit .char{transform:translateY(-7px) scale(1.025)}
.chains{position:absolute;left:50%;bottom:0;height:100%;aspect-ratio:370/297;transform:translateX(-50%);pointer-events:none;transition:transform .08s}
.bling{position:absolute;pointer-events:none;font-size:38px;filter:drop-shadow(0 0 8px #ffc83d);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.say{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.8);background:#fff;color:#1a0608;font-weight:700;padding:7px 12px;border-radius:14px;font-size:15px;opacity:0;transition:.15s;white-space:nowrap;pointer-events:none;z-index:5}
.say.on{opacity:1;transform:translateX(-50%) scale(1)}
.pop{position:absolute;color:var(--gold);font-weight:800;font-size:22px;pointer-events:none;text-shadow:0 2px 4px #000;animation:up .8s forwards;z-index:6}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.tabs{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.tabs button{flex:1;min-width:76px;padding:10px 6px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--gold);color:#2a0d10;border-color:var(--gold)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;color:var(--text);font:inherit}
.item .ic{font-size:28px;width:36px;text-align:center}
.item .nm{font-weight:700;font-size:15px}
.item .ds{font-size:12px;color:var(--mut)}
.item .pr{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap;font-size:14px}
.item.no{opacity:.45}
.item.own{border-color:var(--ok)}
.item.own .pr{color:var(--ok)}
.item.cur{background:var(--panel2);border-color:var(--gold)}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.reset{background:none;border:none;color:var(--mut);text-decoration:underline;font:inherit;font-size:12px;margin:8px auto 0;display:block}
@media (prefers-reduced-motion:reduce){.bling{animation:none}}
.ava{position:absolute;left:8px;bottom:8px;width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);z-index:4;pointer-events:none}
#c3{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ava{display:none}
#sc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.char{transform-box:fill-box;transform-origin:50% 100%;transition:transform .08s}
.gem{animation:fl 2.4s ease-in-out infinite}
</style>
</head>

 h+=P('M160 296 L160 372 L198 372 L198 296Z',C.pants)+P('M202 296 L202 372 L240 372 L240 296Z',C.pants)

 if(t===0)h+=Ln('M166 330 L182 334','#e6eef7',2)+Ln('M214 346 L230 342','#e6eef7',2)+'<ellipse cx="176" cy="318" rx="8" ry="5" fill="'+SK+'" stroke="'+OL+'" stroke-width="2"/>';
 h+=P(t===0?'M152 198 Q200 190 248 198 L244 296 L232 306 L220 296 L208 306 L196 296 L184 306 L172 296 L160 306 L156 296Z':'M152 198 Q200 190 248 198 L246 302 L154 302Z',C.top);
 var sl=su?C.top:SK;
 h+=arm('M153 208 L141 296',29,OL)+arm('M153 208 L141 296',23,sl)+Ci(140,301,11,SK)
  +arm('M247 208 L281 248 L266 214',29,OL)+arm('M247 208 L281 248 L266 214',23,sl)+Ci(266,212,11,SK);
 if(!su)h+=arm('M153 208 L149 232',23,C.top)+arm('M247 208 L261 226',23,C.top);
 h+='<g transform="rotate(-25 268 200)">'+Rc(250,188,38,22,GOLD,4)+Ln('M257 195 L272 195','#fff9',3)+'</g>';
 if(su){
  h+=P('M186 197 L214 197 L200 252Z','#fff',2)+P('M195 204 L205 204 L209 250 L200 264 L191 250Z',C.tie,2)+Ln('M186 197 L172 250 L200 252','#0006',2)+Ln('M214 197 L228 250 L200 252','#0006',2);
  if(t===4)h+=Ln('M156 214 L158 298',GOLD,3)+Ln('M244 214 L242 298',GOLD,3)+Ci(200,284,4,GOLD,1);
 }else h+=P('M182 197 Q200 217 218 197Z',SK,2);
 if(t===0)h+=Rc(172,236,22,18,'#8a6a3a',2,2);
 for(i=0;i<S.chains;i++){var y=224+i*12,d='M184 199 Q200 '+y+' 216 199';h+=Ln(d,OL,7)+'<path d="'+d+'" fill="none" stroke="'+(i%2?'#ffe27a':GOLD)+'" stroke-width="4" stroke-dasharray="6 3" stroke-linecap="round"/>'}
 if(S.chains)h+=Ci(200,(199+224+(S.chains-1)*12)/2+5,7,GOLD,2);

 if(t<2)h+=P('M134 88 Q136 36 200 32 Q264 36 266 88 Q200 70 134 88Z',t?'#2e8b57':'#7a1f2b')+Rc(130,84,140,12,t?'#236b43':'#5a1620',5,3);

function sync3d(force){
 var k=tier()+'|'+S.chains+'|'+Object.keys(S.jew).join()+'|'+S.loc;
 if(!force&&k===lastKey)return;lastKey=k;
 var t=tier(),sc=el('sc'),f={yard:yard,bath:bath,stairs:stairs,pool:pool,yacht:yacht,space:space}[S.loc]||yard;
 sc.innerHTML=f(t)+'<g class="char">'+hero(t)+'</g>';
 var im=sc.querySelector('#fi');if(im)im.setAttribute('href',AVA);
}

function drawLoc(){sync3d(true)}

var sayT,stage=el('stage'),say=el('say');
function speak(){
 var L=loc(),pool=PH.concat(PH.slice(0,3),L.say);
 say.textContent=pool[Math.floor(Math.random()*pool.length)];
 say.classList.add('on');clearTimeout(sayT);sayT=setTimeout(function(){say.classList.remove('on')},1000);
}
var tapLog=[],lockUntil=0;
function isBot(){
 var n=tapLog.length;if(n<10)return false;
 var now=tapLog[n-1].t,fast=tapLog.filter(function(a){return now-a.t<1000}).length;
 if(fast>14)return true;
 if(n<16)return false;
 var iv=[];for(var i=1;i<n;i++)iv.push(tapLog[i].t-tapLog[i-1].t);
 var mean=iv.reduce(function(a,b){return a+b},0)/iv.length;
 var sd=Math.sqrt(iv.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/iv.length);
 if(mean<400&&sd<8)return true;
 var same=tapLog.every(function(a){return a.x===tapLog[0].x&&a.y===tapLog[0].y});
 return same&&mean<250&&sd<25;
}
stage.addEventListener('pointerdown',function(e){
 if(!e.isTrusted)return;
 var now=performance.now();
 if(now<lockUntil)return;
 tapLog.push({t:now,x:e.clientX,y:e.clientY});if(tapLog.length>25)tapLog.shift();
 if(isBot()){
  lockUntil=now+5000;tapLog=[];
  say.textContent='Автокликер? Тапы заблокированы на 5 сек';say.classList.add('on');clearTimeout(sayT);sayT=setTimeout(function(){say.classList.remove('on')},2500);
  return;
 }
 var g=pc();S.money+=g;S.total=(S.total||0)+g;bounce=1;
 var r=stage.getBoundingClientRect(),p=document.createElement('div');
 p.className='pop';p.textContent='+'+fmt(g);
 p.style.left=(e.clientX-r.left-14)+'px';p.style.top=(e.clientY-r.top-20)+'px';
 stage.appendChild(p);setTimeout(function(){p.remove()},800);
 stage.classList.add('hit');setTimeout(function(){stage.classList.remove('hit')},80);
 if(Math.random()<.45||!say.classList.contains('on'))speak();
 upd();
});

setInterval(function(){var d=ps()/10;S.money+=d;S.total=(S.total||0)+d;el('money').textContent=fmt(S.money);el('ps').textContent=fmt(ps())},100);
setInterval(function(){upd();save()},500);
el('reset').onclick=function(){if(confirm('Точно начать заново? Весь прогресс пропадёт.')){S=JSON.parse(JSON.stringify(S0));save();drawChains();drawBling();drawLoc();renderShop()}};

drawChains();drawBling();drawLoc();renderShop();sync3d(true);
})();
