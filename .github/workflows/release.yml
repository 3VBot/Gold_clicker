name: Publish Golda release

on:
  workflow_run:
    workflows:
      - Build Android APK
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Golda-1.0.0-APK
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release APK
        run: |
          test -s release-assets/app-debug.apk
          mv release-assets/app-debug.apk release-assets/Golda-1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 1.0.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: ""
          draft: false
          prerelease: false
          files: release-assets/Golda-1.0.0.apk
          fail_on_unmatched_files: true
