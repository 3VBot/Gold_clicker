name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Cordova
        run: |
          npm install -g cordova
          cordova telemetry off

      - name: Create Android project
        run: |
          cordova create /tmp/android-app com.toska.goldclicker GoldClicker
          cd /tmp/android-app
          cordova platform add android@13.0.0

      - name: Copy game files
        run: |
          rm -rf /tmp/android-app/www/*
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            ./ /tmp/android-app/www/

          # Cordova expects a lowercase index.html entry point.
          if [ ! -f /tmp/android-app/www/index.html ] && [ -f /tmp/android-app/www/Index.html ]; then
            cp /tmp/android-app/www/Index.html /tmp/android-app/www/index.html
          fi

      - name: Verify web entry point
        run: |
          test -s /tmp/android-app/www/index.html
          echo "HTML entry point found:"
          ls -lh /tmp/android-app/www/index.html

      - name: Build APK
        run: |
          cd /tmp/android-app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Clicker-APK
          path: /tmp/android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
